name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SharpShot.slnx

      - name: Build
        run: dotnet build SharpShot.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test (Core)
        run: dotnet test tests/SharpShot.Core.Tests -c Release -p:Platform=x64 --no-build --logger trx

      - name: Test (Capture, without integration)
        run: dotnet test tests/SharpShot.Capture.Tests -c Release -p:Platform=x64 --no-build --logger trx --filter "Category!=Integration"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/SharpShot.App/SharpShot.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -o artifacts/publish/win-x64

      - name: Upload SharpShot-win-x64
        uses: actions/upload-artifact@v4
        with:
          name: SharpShot-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
