name: release

# Creates a GitHub Release with the downloadable package when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SharpShot.slnx

      - name: Test (unit)
        run: |
          dotnet test tests/SharpShot.Core.Tests -c Release -p:Platform=x64
          dotnet test tests/SharpShot.Capture.Tests -c Release -p:Platform=x64 --filter "Category!=Integration"

      - name: Build package (publish + VC++ runtime + zip)
        shell: pwsh
        run: ./tools/release/make-release.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharpShot-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SharpShot ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
